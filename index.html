<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>La Roue de la Fortâche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --stage-bg: #150a1f;
    --curtain-light: #9c1626;
    --curtain-mid: #7a0f1e;
    --curtain-dark: #4a0713;
    --gold: #ffcf4d;
    --gold-deep: #d99a1b;
    --card-border: rgba(255, 207, 77, 0.35);
    --text-light: #f8f3ff;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: 'Baloo 2', system-ui, sans-serif;
    background: var(--stage-bg);
    color: var(--text-light);
    overflow: hidden;
  }

  .stage {
    position: relative;
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    background: radial-gradient(ellipse 140% 90% at 50% -10%, #2a1640 0%, var(--stage-bg) 55%, #0b0712 100%);
    overflow: hidden;
  }

  .spotlight {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: radial-gradient(ellipse 60% 46% at 50% 0%, rgba(255, 178, 80, 0.35), rgba(255, 178, 80, 0) 72%);
    pointer-events: none;
  }

  .curtain {
    position: absolute;
    top: 0;
    bottom: 0;
    width: clamp(60px, 9vw, 160px);
    z-index: 1;
    box-shadow: inset 0 0 70px rgba(0, 0, 0, 0.65);
    pointer-events: none;
  }

  .curtain-left {
    left: 0;
    border-radius: 0 40px 40px 0;
    background: repeating-linear-gradient(100deg,
      var(--curtain-light) 0 14px,
      var(--curtain-mid) 14px 28px,
      var(--curtain-dark) 28px 42px);
  }

  .curtain-left::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0; right: 0;
    width: 6px;
    background: linear-gradient(var(--gold), var(--gold-deep));
    box-shadow: 0 0 14px var(--gold);
  }

  .curtain-right {
    right: 0;
    border-radius: 40px 0 0 40px;
    background: repeating-linear-gradient(80deg,
      var(--curtain-light) 0 14px,
      var(--curtain-mid) 14px 28px,
      var(--curtain-dark) 28px 42px);
  }

  .curtain-right::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0; left: 0;
    width: 6px;
    background: linear-gradient(var(--gold), var(--gold-deep));
    box-shadow: 0 0 14px var(--gold);
  }

  .stage-header {
    position: relative;
    z-index: 2;
    text-align: center;
    flex: 0 0 auto;
    padding: clamp(6px, 1.4vh, 16px) 0 clamp(2px, 0.6vh, 8px);
  }

  .show-title {
    margin: 0;
    font-weight: 800;
    font-size: clamp(26px, 4.2vw, 54px);
    letter-spacing: 0.03em;
    background: linear-gradient(90deg, #ff3b3b, #ff9d3b, #ffe23b, #4be04b, #3b9dff, #a13bff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-stroke: clamp(1px, 0.22vw, 2.5px) rgba(20, 8, 30, 0.9);
    text-shadow: 0 0 18px rgba(255, 178, 60, 0.55), 0 0 38px rgba(255, 80, 180, 0.35);
  }

  .show-subtitle {
    margin: 2px 0 0;
    font-weight: 700;
    font-size: clamp(13px, 1.6vw, 21px);
    letter-spacing: 0.2em;
    color: var(--gold);
    text-shadow: 0 0 10px rgba(255, 196, 60, 0.9), 0 0 22px rgba(255, 140, 20, 0.6);
  }

  .stage-columns {
    position: relative;
    z-index: 2;
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1.1fr 1fr;
    gap: clamp(10px, 1.6vw, 24px);
    padding: 0 clamp(72px, 10vw, 172px) clamp(10px, 1.8vh, 22px);
  }

  .col {
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 1.2vh, 16px);
  }

  .col-wheel {
    align-items: stretch;
  }

  .col-wheel .wheel-frame {
    align-self: center;
  }

  .wheel-frame {
    position: relative;
    width: min(27vw, 48vh);
    aspect-ratio: 1;
  }

  .wheel-frame svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  #bulb-ring {
    z-index: 1;
  }

  #wheel {
    z-index: 2;
    transform-origin: 50% 50%;
    filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.55));
  }

  .wheel-label {
    font-family: 'Baloo 2', sans-serif;
  }

  .bulb {
    fill: #ffdf85;
    stroke: #a8790a;
    stroke-width: 1.5;
    animation: bulb-flicker 1.8s ease-in-out infinite;
  }

  @keyframes bulb-flicker {
    0%, 42% {
      opacity: 1;
      filter: drop-shadow(0 0 5px #ffdf85) drop-shadow(0 0 2px #fff8dc);
    }
    55%, 100% {
      opacity: 0.32;
      filter: drop-shadow(0 0 1px #a8790a);
    }
  }

  .wheel-pointer {
    position: absolute;
    top: -1%;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: clamp(9px, 1.5vw, 18px) solid transparent;
    border-right: clamp(9px, 1.5vw, 18px) solid transparent;
    border-top: clamp(15px, 2.5vw, 30px) solid var(--gold);
    filter: drop-shadow(0 0 8px rgba(255, 205, 60, 0.9)) drop-shadow(0 2px 3px rgba(0, 0, 0, 0.6));
    z-index: 4;
  }

  .panel {
    position: relative;
    flex: 1 1 0;
    min-height: 0;
    background: linear-gradient(180deg, rgba(40, 20, 58, 0.92), rgba(24, 12, 36, 0.94));
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: clamp(10px, 1.6vh, 18px) clamp(12px, 1.4vw, 20px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.03);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-title {
    margin: 0 0 8px;
    font-size: clamp(12px, 1.1vw, 16px);
    letter-spacing: 0.06em;
    color: var(--gold);
    text-transform: uppercase;
    font-weight: 700;
    text-shadow: 0 0 8px rgba(255, 196, 60, 0.5);
    flex: 0 0 auto;
  }

  .result-status {
    margin: 0;
    color: #d8c9ef;
    font-size: clamp(12px, 1vw, 15px);
    flex: 0 0 auto;
  }

  .result-winner {
    margin: auto 0 0;
    text-align: center;
    font-size: clamp(22px, 3.2vw, 42px);
    font-weight: 800;
    color: #fff;
    text-shadow: 0 0 12px rgba(255, 120, 180, 0.85), 0 0 26px rgba(255, 196, 60, 0.6);
    min-height: 1.3em;
    word-break: break-word;
  }

  .journal-empty {
    margin: 0;
    color: #b9a8d6;
    font-size: 0.9em;
  }

  .journal-list, .member-list {
    list-style: none;
    margin: 0;
    padding: 0 2px 0 0;
    overflow-y: auto;
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    scrollbar-width: thin;
    scrollbar-color: var(--gold-deep) rgba(255, 255, 255, 0.08);
  }

  .journal-list::-webkit-scrollbar, .member-list::-webkit-scrollbar { width: 8px; }
  .journal-list::-webkit-scrollbar-thumb, .member-list::-webkit-scrollbar-thumb {
    background: var(--gold-deep);
    border-radius: 8px;
  }

  .journal-list li {
    font-size: clamp(12px, 0.95vw, 15px);
    background: rgba(255, 255, 255, 0.04);
    border-radius: 10px;
    padding: 6px 10px;
    line-height: 1.4;
  }

  .entry-name {
    font-weight: 800;
  }

  .add-member-form {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
    flex: 0 0 auto;
  }

  .add-member-form input {
    flex: 1 1 auto;
    min-width: 0;
  }

  .round-btn {
    flex: 0 0 auto;
    width: 2.3em;
    height: 2.3em;
    border-radius: 50%;
    border: none;
    background: linear-gradient(145deg, #ff8a3d, #ff3d6a);
    color: #fff;
    font-size: 1.2em;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(255, 60, 90, 0.4);
  }

  .round-btn:hover { filter: brightness(1.1); }

  .member-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    border-radius: 999px;
    padding: 6px 8px 6px 12px;
    font-weight: 700;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
  }

  .pill-name {
    flex: 1 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: clamp(12px, 1vw, 15px);
  }

  .weight-badge {
    background: rgba(0, 0, 0, 0.25);
    color: #fff;
    border-radius: 999px;
    padding: 1px 8px;
    font-size: 0.78em;
    flex: 0 0 auto;
  }

  .remove-btn {
    background: #ff2d55;
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 1.6em;
    height: 1.6em;
    font-weight: 800;
    line-height: 1;
    cursor: pointer;
    flex: 0 0 auto;
  }

  .weight-btn {
    flex: 0 0 auto;
    width: 1.5em;
    height: 1.5em;
    border-radius: 50%;
    border: none;
    background: rgba(0, 0, 0, 0.25);
    color: #fff;
    font-weight: 800;
    font-size: 0.85em;
    line-height: 1;
    cursor: pointer;
  }

  .weight-btn:hover:not(:disabled) { background: rgba(0, 0, 0, 0.4); }
  .weight-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .member-limit-message {
    margin: 0 0 8px;
    color: #ff9d9d;
    font-size: 0.85em;
    flex: 0 0 auto;
  }

  .reset-all-btn {
    position: fixed;
    top: clamp(10px, 1.6vh, 18px);
    right: clamp(10px, 1.6vw, 20px);
    z-index: 50;
    border: 3px solid #7a0000;
    border-radius: 999px;
    padding: 10px 18px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-size: clamp(11px, 1vw, 14px);
    color: #fff;
    background: radial-gradient(circle at 30% 30%, #ff5252, #c40000 70%);
    box-shadow: 0 0 0 4px rgba(255, 0, 0, 0.15), 0 6px 16px rgba(180, 0, 0, 0.6);
    cursor: pointer;
  }

  .reset-all-btn:hover { filter: brightness(1.1); }
  .reset-all-btn:active { transform: scale(0.96); }

  .blackout-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    z-index: 9999;
  }

  .assign-task-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1 1 auto;
    justify-content: center;
  }

  input[type="text"] {
    font-family: inherit;
    font-size: clamp(12px, 1vw, 15px);
    padding: 8px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(255, 255, 255, 0.06);
    color: #fff;
  }

  input[type="text"]::placeholder { color: rgba(255, 255, 255, 0.5); }
  input[type="text"]:focus { outline: 2px solid var(--gold); outline-offset: 1px; }

  .spin-btn {
    border: none;
    border-radius: 999px;
    cursor: pointer;
    padding: clamp(10px, 1.8vh, 16px) 10px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    font-size: clamp(12px, 1.15vw, 17px);
    color: #fff;
    background: linear-gradient(135deg, #ff2d55, #ff6f91);
    box-shadow: 0 8px 20px rgba(255, 45, 85, 0.5);
  }

  .spin-btn:hover:not(:disabled) { filter: brightness(1.08); }
  .spin-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  @media (max-width: 900px), (max-height: 480px) {
    body { overflow-y: auto; }
    .stage { height: auto; min-height: 100vh; overflow: visible; }
    .stage-columns { grid-template-columns: 1fr; padding: 0 16px 16px; }
    .wheel-frame { width: min(70vw, 60vh); margin: 0 auto; }
    .panel { flex: 0 0 auto; min-height: 160px; }
    .journal-list, .member-list { max-height: 220px; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="spotlight" aria-hidden="true"></div>
  <div class="curtain curtain-left" aria-hidden="true"></div>
  <div class="curtain curtain-right" aria-hidden="true"></div>
  <button type="button" id="reset-all-btn" class="reset-all-btn">Tout réinitialiser</button>
  <div id="blackout-overlay" class="blackout-overlay" aria-hidden="true"></div>

  <header class="stage-header">
    <h1 class="show-title">LA ROUE DE LA FORTÂCHE</h1>
    <p class="show-subtitle">QUI S'Y COLLE ?</p>
  </header>

  <main class="stage-columns">
    <section class="col col-left">
      <div class="panel team-card">
        <h2 class="panel-title">Équipe</h2>
        <form id="add-member-form" class="add-member-form">
          <input type="text" id="member-name-input" placeholder="Ajouter un membre..." required>
          <button type="submit" id="add-member-btn" class="round-btn" aria-label="Ajouter">+</button>
        </form>
        <p id="member-limit-message" class="member-limit-message" style="display: none;">Maximum 15 participants</p>
        <ul id="member-list" class="member-list"></ul>
      </div>
      <div class="panel task-card">
        <h2 class="panel-title">Nouvelle tâche</h2>
        <form id="assign-task-form" class="assign-task-form">
          <input type="text" id="task-name-input" placeholder="Nouvelle tâche" required>
          <button type="submit" id="spin-button" class="spin-btn">Lancer la roue de la Fortâche !</button>
        </form>
      </div>
    </section>

    <section class="col col-wheel">
      <div class="wheel-frame">
        <svg id="bulb-ring" aria-hidden="true"></svg>
        <svg id="wheel"></svg>
        <div class="wheel-pointer" aria-hidden="true"></div>
      </div>
      <div class="panel result-card" id="result-card">
        <h2 class="panel-title">Résultat du tirage</h2>
        <p id="result-status" class="result-status">Aucun tirage pour l'instant.</p>
        <p id="result-winner" class="result-winner" aria-live="polite"></p>
      </div>
    </section>

    <section class="col col-right">
      <div class="panel journal-card">
        <h2 class="panel-title">Journal des tâches attribuées</h2>
        <p id="journal-empty-message" class="journal-empty">Aucune tâche attribuée pour l'instant.</p>
        <ol id="journal-list" class="journal-list"></ol>
      </div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script>
(function () {
  'use strict';

  const SVG_NS = 'http://www.w3.org/2000/svg';

  const DEFAULT_WEIGHT = 10;
  const WEIGHT_DECREMENT = 2;
  const MIN_WEIGHT = 1;
  const MAX_WEIGHT = 20;
  const MAX_MEMBERS = 15;

  let members = loadMembers();
  let journal = loadJournal();
  let currentRotation = 0;
  let isSpinning = false;

  const memberListEl = document.getElementById('member-list');
  const addMemberForm = document.getElementById('add-member-form');
  const addMemberBtn = document.getElementById('add-member-btn');
  const memberNameInput = document.getElementById('member-name-input');
  const memberLimitMessageEl = document.getElementById('member-limit-message');
  const resetAllBtn = document.getElementById('reset-all-btn');
  const blackoutOverlayEl = document.getElementById('blackout-overlay');
  const wheelEl = document.getElementById('wheel');
  const bulbRingEl = document.getElementById('bulb-ring');
  const assignTaskForm = document.getElementById('assign-task-form');
  const taskNameInput = document.getElementById('task-name-input');
  const spinButton = document.getElementById('spin-button');
  const resultCardEl = document.getElementById('result-card');
  const resultStatusEl = document.getElementById('result-status');
  const resultWinnerEl = document.getElementById('result-winner');
  const journalListEl = document.getElementById('journal-list');
  const journalEmptyMessageEl = document.getElementById('journal-empty-message');

  // Géométrie de la roue : un disque de parts (RADIUS) entouré d'un anneau
  // d'ampoules (jusqu'à BULB_RADIUS). #wheel et #bulb-ring partagent le même
  // viewBox pour rester parfaitement concentriques.
  const WHEEL_DIAMETER = 380;
  const RING_MARGIN = 36;
  const SVG_SIZE = WHEEL_DIAMETER + RING_MARGIN * 2;
  const CENTER = SVG_SIZE / 2;
  const RADIUS = WHEEL_DIAMETER / 2;
  const BULB_RADIUS = RADIUS + RING_MARGIN * 0.55;
  const BULB_COUNT = 32;
  const BULB_CYCLE_SECONDS = 1.8;

  // Palette de couleurs vives, choisies pour rester lisibles sur fond sombre.
  const COLORS = ['#ff4d6d', '#ff9f1c', '#ffd60a', '#8ac926', '#1982c4', '#6a4c93', '#ff70a6', '#00c2a8', '#f15bb5', '#4cc9f0', '#f4a261', '#c77dff'];

  // Prototype sans persistance (phase 4) : tout repart de zéro à chaque
  // rechargement de page, ces fonctions ne font plus que fournir l'état de
  // départ en mémoire.
  function getDefaultMembers() {
    return [
      { name: 'Alice', weight: DEFAULT_WEIGHT },
      { name: 'Bob', weight: DEFAULT_WEIGHT },
      { name: 'Charlie', weight: DEFAULT_WEIGHT }
    ];
  }

  function loadMembers() {
    return getDefaultMembers();
  }

  function loadJournal() {
    return [];
  }

  // Couleur déterministe à partir du nom : le même nom donne toujours la
  // même couleur (pastille équipe, part de roue, journal), y compris après
  // suppression/ré-ajout du membre ou pour une entrée de journal ancienne.
  function colorForName(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) {
      hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
    }
    return COLORS[hash % COLORS.length];
  }

  function textColorFor(bgHex) {
    const r = parseInt(bgHex.slice(1, 3), 16);
    const g = parseInt(bgHex.slice(3, 5), 16);
    const b = parseInt(bgHex.slice(5, 7), 16);
    const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return luminance > 0.6 ? '#1a1020' : '#ffffff';
  }

  function renderMemberList() {
    memberListEl.innerHTML = '';
    members.forEach((member, index) => {
      const li = document.createElement('li');
      li.className = 'member-pill';
      const color = colorForName(member.name);
      li.style.background = color;
      li.style.color = textColorFor(color);

      const nameSpan = document.createElement('span');
      nameSpan.className = 'pill-name';
      nameSpan.textContent = member.name;

      const minusBtn = document.createElement('button');
      minusBtn.type = 'button';
      minusBtn.className = 'weight-btn';
      minusBtn.textContent = '−';
      minusBtn.setAttribute('aria-label', 'Diminuer le poids de ' + member.name);
      minusBtn.disabled = member.weight <= MIN_WEIGHT;
      minusBtn.addEventListener('click', () => adjustWeight(index, -1));

      const weightBadge = document.createElement('span');
      weightBadge.className = 'weight-badge';
      weightBadge.textContent = member.weight;

      const plusBtn = document.createElement('button');
      plusBtn.type = 'button';
      plusBtn.className = 'weight-btn';
      plusBtn.textContent = '+';
      plusBtn.setAttribute('aria-label', 'Augmenter le poids de ' + member.name);
      plusBtn.disabled = member.weight >= MAX_WEIGHT;
      plusBtn.addEventListener('click', () => adjustWeight(index, 1));

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'remove-btn';
      removeBtn.textContent = '×';
      removeBtn.setAttribute('aria-label', 'Retirer ' + member.name);
      removeBtn.addEventListener('click', () => removeMember(index));

      li.appendChild(nameSpan);
      li.appendChild(minusBtn);
      li.appendChild(weightBadge);
      li.appendChild(plusBtn);
      li.appendChild(removeBtn);
      memberListEl.appendChild(li);
    });
  }

  // Réglage manuel du poids (phase 4) : coexiste avec la décrémentation
  // automatique après tirage dans spin(), ne la remplace pas. Borné à
  // [MIN_WEIGHT, MAX_WEIGHT], les boutons se désactivent aux bornes.
  function adjustWeight(index, delta) {
    const member = members[index];
    if (!member) return;
    member.weight = Math.min(MAX_WEIGHT, Math.max(MIN_WEIGHT, member.weight + delta));
    renderMemberList();
    renderWheel();
  }

  function updateMemberLimitUI() {
    const limitReached = members.length >= MAX_MEMBERS;
    addMemberBtn.disabled = limitReached;
    memberNameInput.disabled = limitReached;
    memberLimitMessageEl.style.display = limitReached ? '' : 'none';
  }

  function addMember(name) {
    if (members.length >= MAX_MEMBERS) return;
    const trimmed = name.trim();
    if (!trimmed) return;
    members.push({ name: trimmed, weight: DEFAULT_WEIGHT });
    renderMemberList();
    renderWheel();
    updateMemberLimitUI();
  }

  function removeMember(index) {
    members.splice(index, 1);
    renderMemberList();
    renderWheel();
    updateMemberLimitUI();
  }

  function polarToCartesian(cx, cy, r, angleDeg) {
    const angleRad = (angleDeg - 90) * Math.PI / 180;
    return {
      x: cx + r * Math.cos(angleRad),
      y: cy + r * Math.sin(angleRad)
    };
  }

  // Calcule les bornes angulaires de chaque part, proportionnelles au poids
  // de chaque membre. Utilisé à la fois pour dessiner la roue et pour situer
  // la part du gagnant tiré au sort. (Inchangé depuis la phase 2.)
  function computeSlices() {
    const total = members.reduce((sum, m) => sum + m.weight, 0);
    let cursor = 0;
    return members.map((m) => {
      const sliceAngle = total > 0 ? (m.weight / total) * 360 : 360 / members.length;
      const startAngle = cursor;
      const endAngle = cursor + sliceAngle;
      cursor = endAngle;
      return { name: m.name, weight: m.weight, startAngle: startAngle, endAngle: endAngle };
    });
  }

  // Tirage aléatoire pondéré : chaque membre a une probabilité d'être
  // choisi proportionnelle à son poids courant. (Inchangé depuis la phase 2.)
  function weightedRandomIndex(weights) {
    const total = weights.reduce((sum, w) => sum + w, 0);
    if (total <= 0) return Math.floor(Math.random() * weights.length);
    let r = Math.random() * total;
    for (let i = 0; i < weights.length; i++) {
      r -= weights[i];
      if (r < 0) return i;
    }
    return weights.length - 1;
  }

  function setupSvgViewBoxes() {
    const viewBox = '0 0 ' + SVG_SIZE + ' ' + SVG_SIZE;
    wheelEl.setAttribute('viewBox', viewBox);
    bulbRingEl.setAttribute('viewBox', viewBox);
  }

  // Anneau d'ampoules fixe autour de la jante : rendu une seule fois, dans
  // un SVG séparé du disque des parts, pour ne pas tourner avec lui et pour
  // ne pas réinitialiser le clignotement à chaque ajout/suppression de membre.
  function renderBulbRing() {
    bulbRingEl.innerHTML = '';
    for (let i = 0; i < BULB_COUNT; i++) {
      const angle = (360 / BULB_COUNT) * i;
      const pos = polarToCartesian(CENTER, CENTER, BULB_RADIUS, angle);
      const bulb = document.createElementNS(SVG_NS, 'circle');
      bulb.setAttribute('cx', pos.x);
      bulb.setAttribute('cy', pos.y);
      bulb.setAttribute('r', 6);
      bulb.setAttribute('class', 'bulb');
      bulb.style.animationDelay = ((i / BULB_COUNT) * BULB_CYCLE_SECONDS).toFixed(2) + 's';
      bulbRingEl.appendChild(bulb);
    }
  }

  function renderWheel() {
    wheelEl.innerHTML = '';
    const n = members.length;

    if (n === 0) {
      return;
    }

    if (n === 1) {
      const circle = document.createElementNS(SVG_NS, 'circle');
      circle.setAttribute('cx', CENTER);
      circle.setAttribute('cy', CENTER);
      circle.setAttribute('r', RADIUS);
      circle.setAttribute('fill', colorForName(members[0].name));
      wheelEl.appendChild(circle);
      addLabel(members[0].name, 0, 360, 18);
      return;
    }

    const fontSize = n <= 6 ? 15 : Math.max(9, 15 - (n - 6));
    const slices = computeSlices();

    slices.forEach((slice) => {
      const start = polarToCartesian(CENTER, CENTER, RADIUS, slice.startAngle);
      const end = polarToCartesian(CENTER, CENTER, RADIUS, slice.endAngle);
      const largeArcFlag = (slice.endAngle - slice.startAngle) > 180 ? 1 : 0;

      const path = document.createElementNS(SVG_NS, 'path');
      const d = [
        'M', CENTER, CENTER,
        'L', start.x, start.y,
        'A', RADIUS, RADIUS, 0, largeArcFlag, 1, end.x, end.y,
        'Z'
      ].join(' ');
      path.setAttribute('d', d);
      path.setAttribute('fill', colorForName(slice.name));
      path.setAttribute('stroke', '#fff');
      path.setAttribute('stroke-width', '2');
      wheelEl.appendChild(path);

      addLabel(slice.name, slice.startAngle, slice.endAngle, fontSize);
    });
  }

  // Étiquette en gras blanc avec contour sombre : reste lisible quelle que
  // soit la couleur (et la finesse) de la part sous-jacente. Une
  // contre-rotation (-currentRotation) est appliquée autour du point de
  // l'étiquette elle-même : composée avec la rotation CSS du <svg id="wheel">
  // parent (qui, elle, tourne bien la roue), elle annule uniquement
  // l'inclinaison du texte tout en laissant son ancrage suivre sa part —
  // le texte reste donc toujours droit, y compris quand la roue s'arrête
  // la tête en bas.
  function addLabel(name, startAngle, endAngle, fontSize) {
    const midAngle = (startAngle + endAngle) / 2;
    const labelPos = polarToCartesian(CENTER, CENTER, RADIUS * 0.66, midAngle);
    const text = document.createElementNS(SVG_NS, 'text');
    text.setAttribute('x', labelPos.x);
    text.setAttribute('y', labelPos.y);
    text.setAttribute('transform', 'rotate(' + (-currentRotation) + ' ' + labelPos.x + ' ' + labelPos.y + ')');
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('dominant-baseline', 'middle');
    text.setAttribute('font-size', fontSize);
    text.setAttribute('font-weight', '800');
    text.setAttribute('fill', '#ffffff');
    text.setAttribute('stroke', 'rgba(20,10,25,0.75)');
    text.setAttribute('stroke-width', '3');
    text.setAttribute('paint-order', 'stroke');
    text.setAttribute('class', 'wheel-label');
    text.textContent = name;
    wheelEl.appendChild(text);
  }

  function renderJournal() {
    journalListEl.innerHTML = '';
    journalEmptyMessageEl.style.display = journal.length === 0 ? '' : 'none';
    for (let i = journal.length - 1; i >= 0; i--) {
      const entry = journal[i];
      const li = document.createElement('li');

      const nameSpan = document.createElement('span');
      nameSpan.className = 'entry-name';
      nameSpan.style.color = colorForName(entry.member);
      nameSpan.textContent = entry.member;

      const date = new Date(entry.timestamp);
      const time = date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

      li.appendChild(nameSpan);
      li.appendChild(document.createTextNode(' : ' + entry.task + ' [' + time + ']'));
      journalListEl.appendChild(li);
    }
  }

  function launchConfetti() {
    if (typeof confetti !== 'function') return;
    const rect = resultCardEl.getBoundingClientRect();
    confetti({
      particleCount: 130,
      spread: 75,
      startVelocity: 42,
      scalar: 0.9,
      ticks: 200,
      origin: {
        x: (rect.left + rect.width / 2) / window.innerWidth,
        y: (rect.top + rect.height * 0.4) / window.innerHeight
      },
      colors: ['#ffcf4d', '#ff4d6d', '#8ac926', '#1982c4', '#ffffff']
    });
  }

  function spin(taskName) {
    if (isSpinning) return;
    const n = members.length;
    if (n === 0) {
      resultStatusEl.textContent = 'Ajoutez au moins un membre avant de tourner la roue.';
      return;
    }

    isSpinning = true;
    spinButton.disabled = true;
    resultStatusEl.textContent = 'La roue tourne...';
    resultWinnerEl.textContent = '';

    // 1. Le gagnant est tiré au sort D'ABORD, par tirage pondéré, avant
    //    toute animation : la roue n'est ensuite animée que pour visualiser
    //    ce résultat déjà déterminé, elle ne le décide pas. (Inchangé
    //    depuis la phase 2.)
    const weights = members.map((m) => m.weight);
    const winnerIndex = weightedRandomIndex(weights);

    // 2. La part du gagnant (calculée sur les poids actuels) donne l'angle
    //    d'arrivée de l'animation, sous la flèche fixe en haut de la roue.
    const slices = computeSlices();
    const winnerSlice = slices[winnerIndex];
    const winnerMid = (winnerSlice.startAngle + winnerSlice.endAngle) / 2;

    const extraTurns = 5 * 360;
    const targetRotation = extraTurns - winnerMid;
    currentRotation += targetRotation - (currentRotation % 360);

    wheelEl.style.transition = 'transform 4s cubic-bezier(0.17, 0.67, 0.35, 1)';
    wheelEl.style.transform = 'rotate(' + currentRotation + 'deg)';

    setTimeout(() => {
      const winner = members[winnerIndex];
      winner.weight = Math.max(MIN_WEIGHT, winner.weight - WEIGHT_DECREMENT);

      journal.push({ task: taskName, member: winner.name, timestamp: Date.now() });

      renderMemberList();
      renderWheel();
      renderJournal();

      resultStatusEl.textContent = 'Tâche « ' + taskName + ' » attribuée à :';
      resultWinnerEl.textContent = winner.name;
      launchConfetti();

      taskNameInput.value = '';
      isSpinning = false;
      spinButton.disabled = false;
    }, 4000);
  }

  // Effet « détonateur » du bouton Tout réinitialiser (phase 4) : coupure
  // instantanée au noir (opacité 1 sans transition), réinitialisation de
  // l'état pendant que l'écran est noir, puis fondu progressif de 3s qui
  // révèle l'application repartie de zéro.
  function resetEverything() {
    blackoutOverlayEl.style.transition = 'none';
    blackoutOverlayEl.style.opacity = '1';
    blackoutOverlayEl.style.pointerEvents = 'auto';
    // Force le navigateur à appliquer l'opacité 1 immédiate avant qu'on
    // n'attache la transition du fondu de sortie ci-dessous.
    void blackoutOverlayEl.offsetHeight;

    members = getDefaultMembers();
    journal = [];
    currentRotation = 0;
    isSpinning = false;
    spinButton.disabled = false;
    taskNameInput.value = '';
    resultStatusEl.textContent = "Aucun tirage pour l'instant.";
    resultWinnerEl.textContent = '';
    wheelEl.style.transition = 'none';
    wheelEl.style.transform = 'rotate(0deg)';

    renderMemberList();
    renderWheel();
    renderJournal();
    updateMemberLimitUI();

    requestAnimationFrame(() => {
      blackoutOverlayEl.style.transition = 'opacity 3s ease';
      blackoutOverlayEl.style.opacity = '0';
    });

    setTimeout(() => {
      blackoutOverlayEl.style.pointerEvents = 'none';
    }, 3000);
  }

  addMemberForm.addEventListener('submit', (e) => {
    e.preventDefault();
    if (members.length >= MAX_MEMBERS) return;
    addMember(memberNameInput.value);
    memberNameInput.value = '';
    memberNameInput.focus();
  });

  assignTaskForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const taskName = taskNameInput.value.trim();
    if (!taskName) return;
    spin(taskName);
  });

  resetAllBtn.addEventListener('click', () => {
    if (!confirm("Tout réinitialiser ? Le journal et l'équipe repartiront de zéro.")) return;
    resetEverything();
  });

  setupSvgViewBoxes();
  renderBulbRing();
  renderMemberList();
  renderWheel();
  renderJournal();
  updateMemberLimitUI();
})();
</script>

</body>
</html>
